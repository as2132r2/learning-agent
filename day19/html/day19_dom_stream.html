<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day19 DOM 流式更新</title>
  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #172033;
      background: #eef2f7;
      font-family: system-ui, sans-serif;
    }

    main {
      padding: 26px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px rgb(15 23 42 / 10%);
    }

    #status { color: #b45309; }

    #messages {
      min-height: 280px;
      max-height: 480px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }

    .message {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .user-message {
      margin-left: 15%;
      background: #dbeafe;
    }

    .assistant-message {
      margin-right: 15%;
      background: #dcfce7;
    }

    .system-message {
      color: #64748b;
      background: #e2e8f0;
    }

    .label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      padding: 11px 13px;
      border: 1px solid #94a3b8;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      padding: 11px 20px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Day19 DOM 流式更新</h1>
    <p>观察助手回答如何在同一个绿色消息框中逐渐增长。</p>
    <p id="status">正在连接……</p>

    <section id="messages" aria-live="polite"></section>

    <form id="question-form">
      <input
        id="question-input"
        type="text"
        placeholder="输入任意问题"
        autocomplete="off"
        disabled
      >
      <button id="send-button" type="submit" disabled>发送</button>
    </form>
  </main>

  <script>
    const statusElement = document.querySelector("#status");
    const messagesElement = document.querySelector("#messages");
    const formElement = document.querySelector("#question-form");
    const inputElement = document.querySelector("#question-input");
    const sendButton = document.querySelector("#send-button");

    const websocket = new WebSocket(`ws://${location.host}/ws`);

    // key 是 request_id，value 是对应的助手文本 DOM 元素。
    const answerElements = new Map();
    let activeRequestId = null;

    function createMessage(role, text, className) {
      const container = document.createElement("article");
      container.className = `message ${className}`;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role;

      const content = document.createElement("span");
      content.textContent = text;

      container.append(label, content);
      messagesElement.appendChild(container);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return content;
    }

    function setFormEnabled(enabled) {
      inputElement.disabled = !enabled;
      sendButton.disabled = !enabled;
      if (enabled) inputElement.focus();
    }

    websocket.addEventListener("open", () => {
      statusElement.textContent = "连接状态：已连接";
      statusElement.style.color = "#047857";
      setFormEnabled(true);
    });

    websocket.addEventListener("message", (event) => {
      const message = JSON.parse(event.data);
      const {type, request_id: requestId, payload} = message;

      if (type === "connected") {
        createMessage(
          "系统",
          `连接编号：${payload.connection_id}`,
          "system-message",
        );
      }

      if (type === "start") {
        const answerElement = createMessage(
          "助手",
          "",
          "assistant-message",
        );
        answerElements.set(requestId, answerElement);
      }

      if (type === "token") {
        const answerElement = answerElements.get(requestId);
        if (answerElement) {
          // 关键：更新已有元素，而不是为每个 token 创建新消息框。
          answerElement.textContent += payload.text;
          messagesElement.scrollTop = messagesElement.scrollHeight;
        }
      }

      if (type === "done") {
        answerElements.delete(requestId);
        activeRequestId = null;
        setFormEnabled(true);
        statusElement.textContent = `回答完成，共 ${payload.chunk_count} 个文本块`;
      }

      if (type === "error") {
        createMessage("错误", payload.message, "system-message");
        activeRequestId = null;
        setFormEnabled(true);
      }
    });

    websocket.addEventListener("close", () => {
      statusElement.textContent = "连接状态：已断开";
      statusElement.style.color = "#dc2626";
      setFormEnabled(false);
    });

    websocket.addEventListener("error", () => {
      createMessage("错误", "WebSocket 连接发生错误。", "system-message");
    });

    formElement.addEventListener("submit", (event) => {
      event.preventDefault();

      const question = inputElement.value.trim();
      if (!question || activeRequestId !== null) return;

      activeRequestId = `req-${crypto.randomUUID()}`;
      createMessage("你", question, "user-message");
      setFormEnabled(false);
      statusElement.textContent = "正在接收流式回答……";

      websocket.send(JSON.stringify({
        request_id: activeRequestId,
        question: question,
      }));

      inputElement.value = "";
    });
  </script>
</body>
</html>
