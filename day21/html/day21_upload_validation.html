<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day21 安全文档上传</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 820px; margin: 40px auto; padding: 0 20px;
      color: #172033; background: #eef2f7; font-family: system-ui,sans-serif; }
    main { padding: 28px; border-radius: 16px; background: white;
      box-shadow: 0 10px 30px rgb(15 23 42 / 10%); }
    .rules { padding: 14px 18px; border-radius: 10px; background: #f1f5f9; }
    form { display: flex; align-items: center; gap: 14px; margin: 20px 0;
      padding: 20px; border: 2px dashed #94a3b8; border-radius: 12px; }
    input { flex: 1; } button { padding: 10px 20px; border: 0;
      border-radius: 9px; color: white; background: #2563eb; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { min-height: 24px; font-weight: 600; }
    pre { min-height: 180px; overflow: auto; padding: 15px; border-radius: 10px;
      color: #dbeafe; background: #0f172a; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Day21 安全文档上传</h1>
  <div class="rules">
    <strong>服务端校验：</strong>
    扩展名、声明MIME、1MB大小、UTF-8、NUL字节、空内容和SHA-256重复文件。
  </div>
  <form id="form">
    <input id="file" type="file" accept=".txt,.md" required>
    <button id="button" type="submit">校验并上传</button>
  </form>
  <p id="status">等待选择文件。</p>
  <pre id="result">结果会显示在这里。</pre>
</main>
<script>
  const form = document.querySelector("#form");
  const fileInput = document.querySelector("#file");
  const button = document.querySelector("#button");
  const status = document.querySelector("#status");
  const result = document.querySelector("#result");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const file = fileInput.files[0];
    if (!file) return;

    const body = new FormData();
    body.append("document", file);
    button.disabled = true;
    status.textContent = `正在校验：${file.name}`;

    try {
      const response = await fetch("/upload", {method: "POST", body});
      const data = await response.json();
      result.textContent = JSON.stringify(data, null, 2);

      if (!response.ok) {
        status.textContent = `拒绝上传：${data.message}`;
      } else if (data.duplicate) {
        status.textContent = "内容重复：复用已经保存的文件。";
      } else {
        status.textContent = "校验通过，文件已原子保存。";
        form.reset();
      }
    } catch (error) {
      status.textContent = "网络请求失败。";
      result.textContent = String(error);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
