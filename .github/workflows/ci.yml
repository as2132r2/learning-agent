name: Offline acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m compileall -q learning_agent tests
      - name: Syntax-check archived lessons (not runtime acceptance)
        run: python -m compileall -q day*/python day*/tools
      - run: python -m unittest discover -s tests -v
      - run: python -m learning_agent --check
