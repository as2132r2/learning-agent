<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day19 浏览器大模型流</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 20px;
      color: #172033;
      background: #eef2f7;
      font-family: system-ui, sans-serif;
    }
    main {
      padding: 26px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px rgb(15 23 42 / 10%);
    }
    #status { color: #b45309; }
    #messages {
      min-height: 340px;
      max-height: 560px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }
    .message {
      margin: 12px 0;
      padding: 12px 14px;
      border-radius: 11px;
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .user { margin-left: 15%; background: #dbeafe; }
    .assistant { margin-right: 15%; background: #dcfce7; }
    .system { color: #475569; background: #e2e8f0; }
    .error { color: #b91c1c; background: #fee2e2; }
    .label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
    }
    form { display: flex; gap: 10px; margin-top: 16px; }
    input {
      flex: 1;
      padding: 11px 13px;
      border: 1px solid #94a3b8;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      padding: 11px 22px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #metrics { min-height: 22px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Day19 浏览器大模型流</h1>
    <p id="status">正在连接……</p>
    <p id="metrics"></p>
    <section id="messages" aria-live="polite"></section>

    <form id="question-form">
      <input id="question-input" type="text"
             placeholder="向 DeepSeek 提问" autocomplete="off" disabled>
      <button id="send-button" type="submit" disabled>发送</button>
    </form>
  </main>

  <script>
    const statusElement = document.querySelector("#status");
    const metricsElement = document.querySelector("#metrics");
    const messagesElement = document.querySelector("#messages");
    const formElement = document.querySelector("#question-form");
    const inputElement = document.querySelector("#question-input");
    const sendButton = document.querySelector("#send-button");

    const websocket = new WebSocket(`ws://${location.host}/ws`);
    const answerElements = new Map();
    let activeRequestId = null;

    function addMessage(role, text, className) {
      const box = document.createElement("article");
      box.className = `message ${className}`;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role;
      const content = document.createElement("span");
      content.textContent = text;
      box.append(label, content);
      messagesElement.appendChild(box);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return content;
    }

    function enableForm(enabled) {
      inputElement.disabled = !enabled;
      sendButton.disabled = !enabled;
      if (enabled) inputElement.focus();
    }

    function finishRequest(requestId) {
      answerElements.delete(requestId);
      if (activeRequestId === requestId) activeRequestId = null;
      enableForm(true);
    }

    websocket.addEventListener("open", () => {
      statusElement.textContent = "连接状态：已连接";
      statusElement.style.color = "#047857";
      enableForm(true);
    });

    websocket.addEventListener("message", (event) => {
      const message = JSON.parse(event.data);
      const requestId = message.request_id;
      const payload = message.payload ?? {};

      if (message.type === "connected") {
        addMessage(
          "系统",
          `连接 ${payload.connection_id}，模型 ${payload.model}`,
          "system",
        );
      } else if (message.type === "start") {
        statusElement.textContent = "模型正在流式回答……";
        metricsElement.textContent = "";
        const content = addMessage("助手", "", "assistant");
        answerElements.set(requestId, content);
      } else if (message.type === "token") {
        const content = answerElements.get(requestId);
        if (content) {
          content.textContent += payload.text;
          messagesElement.scrollTop = messagesElement.scrollHeight;
        }
      } else if (message.type === "done") {
        statusElement.textContent = "回答完成";
        metricsElement.textContent =
          `文本块：${payload.chunk_count}，字符：${payload.answer_length}，` +
          `耗时：${payload.elapsed_seconds} 秒`;
        finishRequest(requestId);
      } else if (message.type === "error") {
        addMessage(
          "错误",
          `${payload.error_type ?? "Error"}: ${payload.message}`,
          "error",
        );
        statusElement.textContent = "请求失败";
        finishRequest(requestId);
      }
    });

    websocket.addEventListener("close", () => {
      statusElement.textContent = "连接状态：已断开";
      statusElement.style.color = "#dc2626";
      enableForm(false);
    });

    websocket.addEventListener("error", () => {
      addMessage("错误", "WebSocket 连接发生错误。", "error");
    });

    formElement.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = inputElement.value.trim();

      if (!question || activeRequestId !== null) return;

      activeRequestId = `req-${crypto.randomUUID()}`;
      addMessage("你", question, "user");
      enableForm(false);
      statusElement.textContent = "问题已发送，等待模型……";

      websocket.send(JSON.stringify({
        request_id: activeRequestId,
        question: question,
      }));

      inputElement.value = "";
    });
  </script>
</body>
</html>
