<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day19 WebSocket 基础通信</title>
  <style>
    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2937;
      background: #f3f4f6;
      font-family: system-ui, sans-serif;
    }

    main {
      padding: 24px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
    }

    #status {
      margin-bottom: 16px;
      color: #b45309;
    }

    #messages {
      min-height: 220px;
      max-height: 420px;
      overflow-y: auto;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
    }

    .message {
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .client { color: #1d4ed8; }
    .server { color: #047857; }
    .system { color: #6b7280; }
    .error { color: #dc2626; }

    form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #9ca3af;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Day19 WebSocket 基础通信</h1>
    <p id="status">正在连接……</p>

    <section id="messages" aria-live="polite"></section>

    <form id="message-form">
      <input
        id="message-input"
        type="text"
        placeholder="输入一条消息"
        autocomplete="off"
        disabled
      >
      <button id="send-button" type="submit" disabled>发送</button>
    </form>
  </main>

  <script>
    const statusElement = document.querySelector("#status");
    const messagesElement = document.querySelector("#messages");
    const formElement = document.querySelector("#message-form");
    const inputElement = document.querySelector("#message-input");
    const sendButton = document.querySelector("#send-button");

    // location.host 会自动取得当前网页的主机和端口：127.0.0.1:8016。
    const websocketUrl = `ws://${location.host}/ws`;
    const websocket = new WebSocket(websocketUrl);

    function appendMessage(role, text, className) {
      const messageElement = document.createElement("p");
      messageElement.className = `message ${className}`;
      messageElement.textContent = `${role}：${text}`;
      messagesElement.appendChild(messageElement);
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    websocket.addEventListener("open", () => {
      statusElement.textContent = "连接状态：已连接";
      statusElement.style.color = "#047857";
      inputElement.disabled = false;
      sendButton.disabled = false;
      inputElement.focus();
    });

    websocket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "error") {
        appendMessage("错误", data.message, "error");
        return;
      }

      appendMessage("服务端", data.message, "server");
    });

    websocket.addEventListener("close", () => {
      statusElement.textContent = "连接状态：已断开";
      statusElement.style.color = "#dc2626";
      inputElement.disabled = true;
      sendButton.disabled = true;
      appendMessage("系统", "WebSocket 连接已经关闭。", "system");
    });

    websocket.addEventListener("error", () => {
      appendMessage("错误", "WebSocket 连接发生错误。", "error");
    });

    formElement.addEventListener("submit", (event) => {
      // 阻止 form 默认刷新网页。
      event.preventDefault();

      const text = inputElement.value.trim();
      if (!text || websocket.readyState !== WebSocket.OPEN) {
        return;
      }

      websocket.send(text);
      appendMessage("你", text, "client");
      inputElement.value = "";
      inputElement.focus();
    });
  </script>
</body>
</html>
